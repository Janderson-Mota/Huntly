<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>huntly — buscador de vagas linkedin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="#">huntly.</a>
      <nav class="navbar-links">
        <a href="#filtros" class="nav-link" data-i18n="navFilters">filtros</a>
        <a href="#resultados" class="nav-link" data-i18n="navResults">resultados</a>
        <span class="results-pill" id="navbar-results-pill">
          <span id="navbar-results-count">0 vagas</span>
        </span>
        <select id="lang-select" class="lang-select" aria-label="Language">
          <option value="pt">🇧🇷 Português</option>
          <option value="en">🇺🇸 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
        </select>
        <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Alternar tema">
          <i class="bi bi-moon" id="theme-icon"></i>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <!-- Painel de Filtros -->
    <section id="filtros" class="filters-panel" aria-label="Filtros de Busca">
      <form id="search-form">
        <!-- Campos Principais -->
        <div class="primary-inputs-grid">
          <div class="form-group">
            <label for="keywords" id="keywords-label" data-i18n="labelKeywords">Cargo ou Palavra-chave</label>
            <div class="input-with-icon">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="keywords" name="keywords" list="it-role-suggestions"
                data-i18n-placeholder="placeholderKeywords"
                placeholder="Ex: Desenvolvedor Python, Engenheiro de Dados, DevOps..." required />
              <datalist id="it-role-suggestions">
                <option value="Desenvolvedor Full Stack"></option>
                <option value="Desenvolvedor Back-end"></option>
                <option value="Desenvolvedor Front-end"></option>
                <option value="Desenvolvedor Mobile"></option>
                <option value="Desenvolvedor Python"></option>
                <option value="Desenvolvedor Java"></option>
                <option value="Desenvolvedor Node.js"></option>
                <option value="Desenvolvedor React"></option>
                <option value="Desenvolvedor .NET"></option>
                <option value="Engenheiro de Software"></option>
                <option value="Engenheiro de Dados"></option>
                <option value="Analista de Dados"></option>
                <option value="Cientista de Dados"></option>
                <option value="Engenheiro de Machine Learning"></option>
                <option value="Engenheiro DevOps"></option>
                <option value="Site Reliability Engineer (SRE)"></option>
                <option value="Arquiteto de Software"></option>
                <option value="Tech Lead"></option>
                <option value="QA / Analista de Testes"></option>
                <option value="Analista de Segurança da Informação"></option>
                <option value="Cibersegurança"></option>
                <option value="Administrador de Redes"></option>
                <option value="Analista de Infraestrutura / Cloud"></option>
                <option value="Suporte Técnico / Help Desk"></option>
                <option value="Analista de Sistemas"></option>
                <option value="UX/UI Designer"></option>
                <option value="Product Manager"></option>
                <option value="Scrum Master"></option>
                <option value="Estágio em TI"></option>
              </datalist>
            </div>
          </div>

          <div class="location-cascade" id="location-group">
            <div class="location-selects-grid">
              <div class="form-group">
                <label for="country" data-i18n="labelCountry">País</label>
                <select id="country" name="country" class="form-control"></select>
              </div>
              <div class="form-group">
                <label for="state" data-i18n="labelState">Estado / Região</label>
                <select id="state" name="state" class="form-control"></select>
              </div>
              <div class="form-group">
                <label for="city" data-i18n="labelCity">Cidade (opcional)</label>
                <input type="text" class="form-control" id="city" name="city" list="city-suggestions"
                  data-i18n-placeholder="placeholderCity" placeholder="Ex: Belo Horizonte" />
                <datalist id="city-suggestions"></datalist>
              </div>
            </div>
          </div>
        </div>

        <!-- Filtros Avançados de Vagas -->
        <div id="job-filters" class="advanced-filters">
          <div class="filters-grid">
            <div class="form-group">
              <label for="job_max_date" data-i18n="labelDate">Data de publicação</label>
              <select name="job_max_date" class="form-control" id="job_max_date">
                <option value="" selected data-i18n="dateAny">Qualquer data</option>
                <option value="r24h" data-i18n="date24h">Últimas 24 horas</option>
                <option value="r3d" data-i18n="date3d">Últimos 3 dias</option>
                <option value="r7d" data-i18n="date7d">Última semana</option>
                <option value="r1m" data-i18n="date1m">Último mês</option>
              </select>
            </div>

            <div class="form-group">
              <label for="experience_level" data-i18n="labelExperience">Nível de experiência</label>
              <select name="experience_level" class="form-control" id="experience_level">
                <option value="" selected data-i18n="expAll">Todos os níveis</option>
                <option value="1" data-i18n="expIntern">Estágio</option>
                <option value="2" data-i18n="expJunior">Júnior</option>
                <option value="3,4" data-i18n="expMid">Pleno</option>
                <option value="4" data-i18n="expSenior">Sênior</option>
                <option value="5,6" data-i18n="expDirector">Diretor</option>
              </select>
            </div>

            <div class="form-group">
              <label for="place" data-i18n="labelPlace">Modalidade de trabalho</label>
              <select name="place" class="form-control" id="place">
                <option value="" selected data-i18n="placeAll">Todas as modalidades</option>
                <option value="2" data-i18n="placeRemote">Remoto</option>
                <option value="3" data-i18n="placeHybrid">Híbrido</option>
                <option value="1" data-i18n="placeOnsite">Presencial</option>
              </select>
            </div>

            <div class="form-group">
              <label for="job_type" data-i18n="labelJobType">Tipo de contrato</label>
              <select name="job_type" class="form-control" id="job_type">
                <option value="" selected data-i18n="typeAll">Todos os tipos</option>
                <option value="F" data-i18n="typeFull">Tempo Integral</option>
                <option value="P" data-i18n="typePart">Meio Período</option>
                <option value="I" data-i18n="typeIntern">Estágio</option>
                <option value="C" data-i18n="typeContract">Contrato</option>
                <option value="T" data-i18n="typeTemp">Temporário</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Ações Principais -->
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="reset-filters-btn">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span data-i18n="btnReset">limpar filtros</span>
          </button>

          <button type="button" class="btn btn-danger" id="stop-button" style="display: none">
            <i class="bi bi-stop-circle"></i>
            <span data-i18n="btnStop">Parar Busca</span>
          </button>

          <button type="submit" class="btn btn-primary" id="search-btn">
            <span id="search-btn-text" data-i18n="btnSearch">Buscar Vagas</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </div>
      </form>

      <!-- Barra de Progresso -->
      <div id="status-section" class="status-section" style="display: none">
        <div class="status-meta">
          <span class="status-indicator">
            <i class="bi bi-arrow-repeat spin" id="status-spinner"></i>
            <span class="status-text" data-i18n="statusPreparing">Preparando busca...</span>
          </span>
          <span class="status-percent" id="status-percent">0%</span>
        </div>
        <div class="progress">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Mensagem de Erro / Aviso discreta -->
      <div id="feedback-banner" class="feedback-banner" style="display: none"></div>
    </section>

    <!-- Seção de Resultados em Cards abaixo dos filtros -->
    <section id="resultados" class="results-section" aria-label="Resultados da Busca">
      <div id="results-toolbar" class="results-toolbar" style="display: none">
        <div class="quick-filter-box">
          <i class="bi bi-funnel"></i>
          <input type="text" id="quick-filter-input" class="form-control form-control-sm"
            data-i18n-placeholder="quickFilterPlaceholder"
            placeholder="Filtrar cards por título, empresa ou cidade..." />
        </div>

        <div class="export-buttons">
          <span id="results-count-text" class="results-count-label">0 vagas</span>
          <button type="button" class="btn btn-outline btn-sm export-btn" data-format="csv" disabled data-i18n="btnExportCsv">
            exportar csv ↗
          </button>
          <button type="button" class="btn btn-outline btn-sm export-btn" data-format="json" disabled data-i18n="btnExportJson">
            exportar json ↗
          </button>
        </div>
      </div>

      <div id="empty-state" class="empty-state">
        <h3 data-i18n="emptyInitialTitle">Nenhuma busca realizada ainda</h3>
        <p data-i18n="emptyInitialDesc">Configure os filtros acima e clique em Buscar Vagas para exibir os cards aqui.</p>
      </div>

      <div id="results-grid" class="results-grid"></div>
      <nav id="pagination-bar" class="pagination-bar" style="display: none" aria-label="Paginação de resultados"></nav>
    </section>
  </main>

  <!-- Modal de Detalhes da Vaga -->
  <div id="job-modal" class="modal-backdrop" style="display: none" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modal-title">Título da Vaga</h3>
          <p id="modal-company" class="modal-subtitle"></p>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="close-modal-btn" aria-label="Fechar">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div id="modal-badges" class="modal-badges"></div>
      <div id="modal-description" class="modal-body"></div>
      <div class="modal-footer">
        <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-primary" data-i18n="modalOpenLinkedin">
          abrir vaga no linkedin ↗
        </a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
