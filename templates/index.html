<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>huntly — buscador de vagas linkedin</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23195e3a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='Georgia,serif' font-weight='bold' font-size='20'%3Eh%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>

<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="#">huntly.</a>
      <nav class="navbar-nav" aria-label="Navegação principal" data-i18n-aria-label="ariaMainNav">
        <a href="#filtros" class="nav-link" data-i18n="navFilters">filtros</a>
        <a href="#resultados" class="nav-link" data-i18n="navResults">resultados</a>
      </nav>
      <div class="navbar-controls">
        <select id="lang-select" class="lang-select" aria-label="Idioma" data-i18n-aria-label="ariaLangSelect">
          <option value="pt">🇧🇷 Português</option>
          <option value="en">🇺🇸 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
        </select>
        <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Alternar tema" data-i18n-aria-label="ariaThemeToggle">
          <i class="bi bi-moon" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Painel de Filtros -->
    <section id="filtros" class="filters-panel" aria-label="Filtros de Busca" data-i18n-aria-label="ariaFiltersSection">
      <form id="search-form">
        <!-- Campos Principais -->
        <div class="primary-inputs-grid">
          <div class="form-group">
            <label for="keywords" id="keywords-label" data-i18n="labelKeywords">Cargo ou Palavra-chave (opcional)</label>
            <div class="input-with-icon">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="keywords" name="keywords" list="it-role-suggestions"
                data-i18n-placeholder="placeholderKeywords"
                placeholder="Ex: Desenvolvedor Python, Engenheiro de Dados, DevOps..." />
              <datalist id="it-role-suggestions"></datalist>
            </div>
          </div>

          <div class="location-cascade" id="location-group">
            <div class="location-selects-grid">
              <div class="form-group">
                <label for="country" data-i18n="labelCountry">País</label>
                <select id="country" name="country" class="form-control"></select>
              </div>
              <div class="form-group">
                <label for="state" data-i18n="labelState">Estado / Região</label>
                <select id="state" name="state" class="form-control"></select>
              </div>
              <div class="form-group">
                <label for="city" data-i18n="labelCity">Cidade (opcional)</label>
                <input type="text" class="form-control" id="city" name="city" list="city-suggestions"
                  data-i18n-placeholder="placeholderCity" placeholder="Ex: Belo Horizonte" />
                <datalist id="city-suggestions"></datalist>
              </div>
            </div>
          </div>
        </div>

        <!-- Filtros Avançados de Vagas -->
        <div id="job-filters" class="advanced-filters">
          <div class="filters-grid">
            <div class="form-group">
              <label for="job_max_date" data-i18n="labelDate">Data de publicação</label>
              <select name="job_max_date" class="form-control" id="job_max_date">
                <option value="" selected data-i18n="dateAny">Qualquer data</option>
                <option value="r24h" data-i18n="date24h">Últimas 24 horas</option>
                <option value="r3d" data-i18n="date3d">Últimos 3 dias</option>
                <option value="r7d" data-i18n="date7d">Última semana</option>
                <option value="r1m" data-i18n="date1m">Último mês</option>
              </select>
            </div>

            <div class="form-group">
              <label for="experience_level_btn" data-i18n="labelExperience">Nível de experiência</label>
              <div class="multi-select" id="experience-multiselect" data-name="experience_level" data-default-key="expAll">
                <button type="button" class="form-control multi-select-trigger" id="experience_level_btn"
                  aria-haspopup="listbox" aria-expanded="false"
                  aria-label="Selecionar níveis de experiência" data-i18n-aria-label="ariaExperienceMulti">
                  <span class="multi-select-label" data-i18n="expAll">Todos os níveis</span>
                  <i class="bi bi-chevron-down multi-select-caret"></i>
                </button>
                <div class="multi-select-menu" role="group" aria-label="Nível de experiência" data-i18n-aria-label="labelExperience">
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="1" />
                    <span data-i18n="expIntern">Estágio</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="trainee" />
                    <span data-i18n="expTrainee">Trainee</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="2" />
                    <span data-i18n="expJunior">Júnior</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="3,4" />
                    <span data-i18n="expMid">Pleno</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="4" />
                    <span data-i18n="expSenior">Sênior</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="tech_lead" />
                    <span data-i18n="expTechLead">Tech Lead</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="experience_level" value="5,6" />
                    <span data-i18n="expDirector">Diretor</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="work_mode_btn" data-i18n="labelPlace">Modalidade de trabalho</label>
              <div class="multi-select" id="work-mode-multiselect" data-name="work_mode" data-default-key="placeAll">
                <button type="button" class="form-control multi-select-trigger" id="work_mode_btn"
                  aria-haspopup="listbox" aria-expanded="false"
                  aria-label="Selecionar modalidades de trabalho" data-i18n-aria-label="ariaWorkModeMulti">
                  <span class="multi-select-label" data-i18n="placeAll">Todas as modalidades</span>
                  <i class="bi bi-chevron-down multi-select-caret"></i>
                </button>
                <div class="multi-select-menu" role="group" aria-label="Modalidade de trabalho" data-i18n-aria-label="labelPlace">
                  <label class="multi-select-option">
                    <input type="checkbox" name="work_mode" value="2" />
                    <span data-i18n="placeRemote">Remoto</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="work_mode" value="3" />
                    <span data-i18n="placeHybrid">Híbrido</span>
                  </label>
                  <label class="multi-select-option">
                    <input type="checkbox" name="work_mode" value="1" />
                    <span data-i18n="placeOnsite">Presencial</span>
                  </label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="sort_by" data-i18n="labelSortBy">Ordenar por</label>
              <select name="sort_by" class="form-control" id="sort_by">
                <option value="R" selected data-i18n="sortRelevant">Mais relevantes</option>
                <option value="DD" data-i18n="sortRecent">Mais recentes</option>
              </select>
            </div>

            <div class="form-group">
              <label for="limit_jobs" data-i18n="labelLimitJobs">Limite de vagas</label>
              <select name="limit_jobs" class="form-control" id="limit_jobs">
                <option value="25" selected data-i18n="limit25">25 vagas</option>
                <option value="50" data-i18n="limit50">50 vagas</option>
                <option value="75" data-i18n="limit75">75 vagas</option>
                <option value="unlimited" data-i18n="limitUnlimited">Sem restrição</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Ações Principais -->
        <div class="form-actions">
          <div class="form-actions-buttons">
            <button type="button" class="btn btn-outline" id="reset-filters-btn">
              <i class="bi bi-arrow-counterclockwise"></i>
              <span data-i18n="btnReset">Limpar filtros</span>
            </button>

            <button type="button" class="btn btn-danger" id="stop-button" style="display: none">
              <i class="bi bi-stop-circle"></i>
              <span data-i18n="btnStop">Parar busca</span>
            </button>

            <button type="submit" class="btn btn-primary" id="search-btn">
              <span id="search-btn-text" data-i18n="btnSearch">Buscar vagas</span>
              <i class="bi bi-arrow-right"></i>
            </button>
          </div>
        </div>
      </form>

      <!-- Barra de Progresso -->
      <div id="status-section" class="status-section" style="display: none">
        <div class="status-meta">
          <span class="status-indicator">
            <i class="bi bi-arrow-repeat spin" id="status-spinner"></i>
            <span class="status-text" data-i18n="statusPreparing">Iniciando busca...</span>
          </span>
          <span class="status-percent" id="status-percent">0%</span>
        </div>
        <div class="progress">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Mensagem de Erro / Aviso discreta -->
      <div id="feedback-banner" class="feedback-banner" style="display: none"></div>
    </section>

    <!-- Seção de Resultados em Cards abaixo dos filtros -->
    <section id="resultados" class="results-section" aria-label="Resultados da Busca" data-i18n-aria-label="ariaResultsSection">
      <div id="results-tabs" class="results-tabs" role="tablist" style="display: none"
        aria-label="Classificação de resultados" data-i18n-aria-label="ariaResultsTabs">
        <button type="button" class="results-tab active" id="tab-matched" role="tab" aria-selected="true" data-tab="matched">
          <span data-i18n="tabMatched">Correspondentes</span>
          <span class="tab-count" id="tab-matched-count">0</span>
        </button>
        <button type="button" class="results-tab" id="tab-recommended" role="tab" aria-selected="false" data-tab="recommended">
          <span data-i18n="tabRecommended">Talvez você goste</span>
          <span class="tab-count" id="tab-recommended-count">0</span>
        </button>
      </div>

      <div id="results-toolbar" class="results-toolbar" style="display: none">
        <div class="results-filters">
          <div class="quick-filter-box">
            <i class="bi bi-funnel"></i>
            <input type="text" id="quick-filter-input" class="form-control form-control-sm"
              data-i18n-placeholder="quickFilterPlaceholder"
              data-i18n-aria-label="ariaQuickFilter"
              placeholder="Filtrar cards por título, empresa ou cidade..."
              aria-label="Filtrar cards por título, empresa ou cidade" />
          </div>

          <div class="quick-filter-box exclude-filter-box">
            <i class="bi bi-slash-circle"></i>
            <input type="text" id="exclude-filter-input" class="form-control form-control-sm"
              data-i18n-placeholder="excludeFilterPlaceholder"
              data-i18n-aria-label="ariaExcludeFilter"
              placeholder="Excluir termos (ex: Sênior, Estágio)..."
              aria-label="Excluir vagas com palavras-chave indesejadas" />
          </div>
        </div>

        <div class="export-buttons">
          <span id="results-count-text" class="results-count-label">0 vagas</span>
          <button type="button" class="btn btn-outline btn-sm export-btn" data-format="csv" disabled data-i18n="btnExportCsv">
            Exportar CSV
          </button>
          <button type="button" class="btn btn-outline btn-sm export-btn" data-format="json" disabled data-i18n="btnExportJson">
            Exportar JSON
          </button>
        </div>
      </div>

      <div id="empty-state" class="empty-state">
        <h3 data-i18n="emptyInitialTitle">Pronto para buscar</h3>
        <p data-i18n="emptyInitialDesc">Escolha um cargo ou filtro acima para listar vagas.</p>
      </div>

      <div id="results-grid" class="results-grid"></div>
      <nav id="pagination-bar" class="pagination-bar" style="display: none" aria-label="Paginação de resultados" data-i18n-aria-label="ariaPagination"></nav>
    </section>
  </main>

  <footer class="site-footer" aria-label="Rodapé" data-i18n-aria-label="ariaFooter">
    <div class="site-footer-inner">
      <div class="footer-identity">
        <a class="footer-brand" href="#">huntly.</a>
        <p class="footer-note" data-i18n="footerTagline">Busca em vagas públicas do LinkedIn · não afiliado ao LinkedIn</p>
      </div>
      <div class="footer-right">
        <nav class="footer-nav" aria-label="Navegação do rodapé" data-i18n-aria-label="ariaFooterNav">
          <a href="#filtros" class="footer-link" data-i18n="navFilters">filtros</a>
          <a href="#resultados" class="footer-link" data-i18n="navResults">resultados</a>
          <a href="#" class="footer-link" data-i18n="footerBackToTop">topo ↑</a>
        </nav>
        <span class="footer-divider" aria-hidden="true">|</span>
        <p class="footer-meta" data-i18n="footerRights">© 2026</p>
      </div>
    </div>
  </footer>

  <!-- Modal de Detalhes da Vaga -->
  <div id="job-modal" class="modal-backdrop" style="display: none" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modal-title" data-i18n="modalTitleFallback">Título da Vaga</h3>
          <p id="modal-company" class="modal-subtitle"></p>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="close-modal-btn" aria-label="Fechar" data-i18n-aria-label="ariaCloseModal">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div id="modal-badges" class="modal-badges"></div>
      <div id="modal-description" class="modal-body"></div>
      <div class="modal-footer">
        <a id="modal-link" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-primary" data-i18n="modalOpenLinkedin">
          Abrir vaga no LinkedIn ↗
        </a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
